[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overcode"
version = "0.5.4"
description = "A supervisor for managing multiple Claude Code instances in tmux"
authors = [
    {name = "Mike Bond"}
]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "textual>=0.40.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "libtmux>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/mkb23/overcode"
Repository = "https://github.com/mkb23/overcode"
Issues = "https://github.com/mkb23/overcode/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "pyte>=0.8.0",
    "pillow>=10.0.0",
]

# macOS presence detection (optional)
presence = [
    "pyobjc-framework-Quartz>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

# Data export to Parquet format
export = [
    "pyarrow>=14.0.0",
]

[project.scripts]
overcode = "overcode.entrypoint:main"
tui-eye = "overcode.testing.tui_eye:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overcode = [
    "*.md",
    "*.sh",
    "*.tcss",
    "web/templates/*.html",
    # Bundled opencode telemetry plugin — copied into a project's
    # .opencode/plugins/ at launch, so it has to ship with the wheel.
    # v1 is a single .js file; v2 ships a plugin directory (server stub
    # index.js + TUI entry tui.js + the shared core .mjs it imports).
    "opencode_plugin/*.js",
    "opencode_plugin/overcode-telemetry-v2/*",
    # Bundled Hermes telemetry plugin — copied into $HERMES_HOME/plugins/
    # overcode/ at launch (the .py ships as a module; the manifest must too).
    "hermes_plugin/*.yaml",
    # Bundled models.dev snapshot (context windows + list prices, #473) —
    # refreshed by scripts/refresh_model_metadata.py.
    "data/*.json",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
