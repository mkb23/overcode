name: E2E (containerized)

# The containerized workflow and visual tiers: mock agents, no credentials.
# The real-LLM tier spends tokens, so it runs on a Mac and is recorded
# (make e2e-record TIER=container-real), not run here.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build E2E image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/e2e/Dockerfile
          target: e2e
          tags: overcode-e2e:local
          outputs: type=docker,dest=/tmp/overcode-e2e.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-image
          path: /tmp/overcode-e2e.tar
          retention-days: 1

  e2e-workflows:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-image
          path: /tmp
      - run: docker load -i /tmp/overcode-e2e.tar
      - name: Run workflow tier
        run: ./scripts/e2e.sh --no-build tests/container/workflows -v --junitxml=/artifacts/junit-workflows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-workflow-results
          path: artifacts/e2e/

  e2e-visual:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-image
          path: /tmp
      - run: docker load -i /tmp/overcode-e2e.tar
      - name: Run visual tier
        run: ./scripts/e2e.sh --no-build tests/container/visual -v --junitxml=/artifacts/junit-visual.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-visual-results
          path: artifacts/e2e/
