name: Publish to PyPI

# A release publishes only a commit that passed everything: a green Full
# suite run on that exact commit (push it to `rc` first) and fresh passing
# reports for the local e2e tiers (tests/e2e-reports). If the gate fails,
# fix that, then re-run this workflow.
on:
  release:
    types: [published]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full suite passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/full-suite.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq .total_count)
          if [ "$runs" = "0" ]; then
            echo "::error::No green Full suite run for ${GITHUB_SHA}. Push this commit to rc (git push origin ${GITHUB_SHA}:rc), wait for it to pass, then re-run this workflow."
            exit 1
          fi
          echo "Full suite passed on ${GITHUB_SHA} (${runs} run(s))"
      - name: Local e2e tiers have fresh passing reports
        run: python scripts/e2e_reports.py check --ref "$GITHUB_SHA"

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install built wheel
        run: pip install dist/*.whl

      - name: Verify CLI entry points work
        run: |
          overcode --help
          overcode monitor --help

      - name: Verify package data files included
        run: |
          python -c "
          import importlib.resources as resources
          import overcode

          # List all files that should be in the package
          expected = ['tui.tcss', 'docs/tui-guide.md', 'docs/configuration.md']

          pkg_path = resources.files(overcode)
          for f in expected:
              assert (pkg_path / f).is_file(), f'Missing package data: {f}'
          print('All package data files present')
          "

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
