name: Nightly

# The slower tiers, on a schedule. Never a merge gate: when something fails,
# one issue labelled `nightly` is opened (or commented on, if one is already
# open) naming the failing tiers and linking the run. Close the issue once
# the tiers are green again.
#
# Timing budgets in tests/scale were calibrated on an M-series Mac; a hosted
# runner is slower. A scale failure here is a prompt to look, not proof of a
# regression: compare with `python scripts/bench_backends.py` locally.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q -p no:cacheprovider
        env:
          NO_COLOR: "1"

  scale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: pytest tests/scale -q -p no:cacheprovider -rxX
        env:
          OVERCODE_SCALE_TESTS: "1"
          NO_COLOR: "1"

  backend-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: pip install -e ".[dev]"
      - run: pytest -m e2e tests/e2e/test_backend_matrix.py tests/e2e/test_opencode2_backend.py -q -p no:cacheprovider
        env:
          NO_COLOR: "1"

  report:
    needs: [unit, scale, backend-matrix]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId,
            });
            const failed = jobs.filter(j => j.conclusion === "failure").map(j => `- ${j.name}`);
            const body = `Nightly tiers failing on ${context.sha.slice(0, 7)}:\n\n${failed.join("\n")}\n\nRun: ${run}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, labels: "nightly", state: "open",
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "Nightly tests failing", labels: ["nightly"], body,
              });
            }
